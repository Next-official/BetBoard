let currentUser = null;
let isAdmin = false;

function cleanKey(str) {
    return encodeURIComponent(str).replace(/\./g, '%2E');
}

function init() {
    listenToFirebase();
}

function setStatus(msg) {
    document.getElementById('statusBar').textContent = msg;
}

function listenToFirebase() {
    db.ref('.info/connected').on('value', snap => {
        if (snap.val() === true) {
            setStatus(currentUser ? "Connesso come: " + currentUser.name : "Connesso al database");
        } else {
            setStatus("Connessione...");
        }
    });

    db.ref('users').on('value', snapshot => {
        const val = snapshot.val() || {};
        usersMap = val;
        users = [];
        
        Object.keys(val).forEach(key => {
            users.push({
                _dbKey: key,
                ...val[key]
            });
        });
        
        loadCurrentUser();
        updateUI();
        renderRanking();
        if (isAdmin) renderAdminUsers();
    });

    db.ref('bets').on('value', snapshot => {
        const val = snapshot.val();
        bets = val ? Object.values(val).reverse() : [];
        renderBets();
        if (isAdmin) renderAdminBets();
    });

    db.ref('rules').on('value', snapshot => {
        const val = snapshot.val();
        if (val) gameRules = val;
        renderRules();
    });
}

function switchTab(tab) {
    document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tabProfileBtn').classList.toggle('active', tab === 'profile');
    document.getElementById('tabBetsBtn').classList.toggle('active', tab === 'bets');
    document.getElementById('tabRankingBtn').classList.toggle('active', tab === 'ranking');
    document.getElementById('tabRulesBtn').classList.toggle('active', tab === 'rules');

    document.getElementById('profileTab').classList.toggle('hidden', tab !== 'profile');
    document.getElementById('betsTab').classList.toggle('hidden', tab !== 'bets');
    document.getElementById('rankingTab').classList.toggle('hidden', tab !== 'ranking');
    document.getElementById('rulesTab').classList.toggle('hidden', tab !== 'rules');

    if (tab === 'bets') renderBets();
    if (tab === 'ranking') renderRanking();
    if (tab === 'rules') renderRules();
}

function registerUser() {
    const user = document.getElementById('authUsername').value.trim();
    const pass = document.getElementById('authPassword').value;
    const code = document.getElementById('authSchoolCode').value.trim();

    if (!user || !pass) return alert("Inserisci Nickname e Password!");
    if (code !== SCHOOL_API_CODE) return alert("Codice Scuola (API) errato o mancante!");

    let found = users.find(u => u.name && u.name.toLowerCase() === user.toLowerCase());
    if (found) return alert("Nickname già esistente!");

    const newUser = { name: user, password: pass, points: 0 };
    const safeKey = cleanKey(user);
    
    db.ref('users/' + safeKey).set(newUser).then(() => {
        currentUser = { ...newUser, _dbKey: safeKey };
        localStorage.setItem('sb95_currentUser', currentUser.name);
        document.getElementById('authSchoolCode').value = "";
        updateUI();
        alert("Profilo creato con successo!");
    }).catch(err => alert("Errore: " + err.message));
}

function loginUser() {
    const user = document.getElementById('authUsername').value.trim();
    const pass = document.getElementById('authPassword').value;

    let found = users.find(u => u.name && u.name.toLowerCase() === user.toLowerCase() && u.password === pass);
    if (!found) return alert("Credenziali errate o utente non trovato!");

    currentUser = found;
    localStorage.setItem('sb95_currentUser', currentUser.name);
    updateUI();
    setStatus("Connesso come: " + currentUser.name);
}

function logout() {
    currentUser = null;
    localStorage.removeItem('sb95_currentUser');
    updateUI();
    setStatus("Scollegato.");
}

function updateUI() {
    if (currentUser) {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('profileBox').classList.remove('hidden');
        document.getElementById('userNameDisplay').textContent = currentUser.name;
        document.getElementById('userPointsDisplay').textContent = (currentUser.points || 0) + " PT";
    } else {
        document.getElementById('authBox').classList.remove('hidden');
        document.getElementById('profileBox').classList.add('hidden');
    }
}

function extractWords(text) {
    return text.toLowerCase()
        .replace(/[^\w\ss̀àèéìòù]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length >= 3);
}

function sendBet() {
    if (!currentUser) return alert("Effettua prima l'accesso!");
    const text = document.getElementById('newBetText').value.trim();
    const pts = parseInt(document.getElementById('newBetPts').value);

    if (!text) return alert("Inserisci il testo della scommessa!");

    const now = Date.now();
    const oneWeekMs = 7 * 24 * 60 * 60 * 1000;

    const userBets = bets.filter(b => b.author && b.author.toLowerCase() === currentUser.name.toLowerCase());

    const recentBetsCount = userBets.filter(b => (now - b.id) < oneWeekMs).length;
    if (recentBetsCount >= 5) {
        return alert("Hai già inviato 5 scommesse questa settimana!");
    }

    const newWords = extractWords(text);
    for (let b of userBets) {
        const existingWords = extractWords(b.text || "");
        const commonWords = newWords.filter(w => existingWords.includes(w));
        if (commonWords.length >= 3) {
            return alert("La scommessa è troppo simile ad una tua scommessa precedente!");
        }
    }

    const betId = now;
    const newBet = {
        id: betId,
        author: currentUser.name,
        text: text,
        pts: pts,
        status: "open",
        awardedPts: 0
    };

    db.ref('bets/' + betId).set(newBet).then(() => {
        document.getElementById('newBetText').value = "";
        setStatus("Scommessa pubblicata!");
    }).catch(err => alert("Errore: " + err.message));
}

function renderBets() {
    const container = document.getElementById('betsList');
    container.innerHTML = '';

    if (bets.length === 0) {
        container.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding:15px;">Nessuna scommessa disponibile.</p>';
        return;
    }

    bets.forEach(b => {
        const div = document.createElement('div');
        div.className = 'bet-card';
        
        let badge = b.status === 'open' 
            ? `<span class="badge badge-open">IN ATTESA</span>` 
            : `<span class="badge badge-closed">+${b.awardedPts} PT</span>`;

        div.innerHTML = `
            <div class="bet-header">
                <span class="bet-author">${b.author || 'Anonimo'}</span>
                ${badge}
            </div>
            <div class="bet-text">${b.text || ''}</div>
            <div style="font-size:11px; color:var(--text-secondary);">Punti in palio: <b>${b.pts || 0} PT</b></div>
        `;
        container.appendChild(div);
    });
}

function renderRanking() {
    const container = document.getElementById('rankingList');
    container.innerHTML = '';

    const sorted = [...users].sort((a,b) => (b.points || 0) - (a.points || 0));
    if (sorted.length === 0) {
        container.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding:15px;">Nessun utente trovato.</p>';
        return;
    }

    sorted.forEach((u, idx) => {
        const item = document.createElement('div');
        item.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #d0e0f0;";
        item.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-weight:bold; color:var(--text-secondary); width:20px;">#${idx+1}</span>
                <span style="font-weight:bold; color:#003366;">${u.name || 'Senza Nome'}</span>
            </div>
            <span style="font-weight:bold; color:var(--accent);">${u.points || 0} PT</span>
        `;
        container.appendChild(item);
    });
}

function renderRules() {
    document.getElementById('rulesContent').textContent = gameRules;
}

function openAdminModal() {
    document.getElementById('adminModal').classList.remove('hidden');
}

function closeAdminModal() {
    document.getElementById('adminModal').classList.add('hidden');
}

function loginAdmin() {
    if (document.getElementById('adminPassInput').value === CREATOR_PASS) {
        isAdmin = true;
        document.getElementById('adminLoginForm').classList.add('hidden');
        document.getElementById('adminControls').classList.remove('hidden');
        renderAdminBets();
        renderAdminUsers();
        document.getElementById('rulesTextarea').value = gameRules;
    } else {
        alert("Password non corretta!");
    }
}

function logoutAdmin() {
    isAdmin = false;
    document.getElementById('adminPassInput').value = "";
    document.getElementById('adminLoginForm').classList.remove('hidden');
    document.getElementById('adminControls').classList.add('hidden');
    closeAdminModal();
}

function switchAdminTab(sec) {
    document.getElementById('adminTabBetsBtn').classList.toggle('active', sec === 'bets');
    document.getElementById('adminTabUsersBtn').classList.toggle('active', sec === 'users');
    document.getElementById('adminTabRulesBtn').classList.toggle('active', sec === 'rules');

    document.getElementById('adminBetsSec').classList.toggle('hidden', sec !== 'bets');
    document.getElementById('adminUsersSec').classList.toggle('hidden', sec !== 'users');
    document.getElementById('adminRulesSec').classList.toggle('hidden', sec !== 'rules');
}

function renderAdminBets() {
    const container = document.getElementById('adminBetsList');
    container.innerHTML = '';

    if (bets.length === 0) {
        container.innerHTML = '<p style="color:var(--text-secondary);">Nessuna scommessa.</p>';
        return;
    }

    bets.forEach(b => {
        const div = document.createElement('div');
        div.className = 'bet-card';
        
        let actions = b.status === 'open' ? `
            <div style="display:flex; gap:6px; margin-top:8px;">
                <button class="btn-modern" style="flex:1; padding:4px 6px; font-size:11px;" onclick="awardPoints(${b.id})">Assegna</button>
                <button class="btn-modern btn-danger" style="padding:4px 6px; font-size:11px;" onclick="deleteBet(${b.id})">Elimina</button>
            </div>
        ` : `<div style="color:var(--success); font-weight:bold; margin-top:4px; font-size:11px;">Completata (+${b.awardedPts} PT)</div>`;

        div.innerHTML = `
            <div style="font-weight:bold; color:var(--accent); margin-bottom:4px;">${b.author || 'Anonimo'} (${b.pts || 0} PT)</div>
            <div>${b.text || ''}</div>
            ${actions}
        `;
        container.appendChild(div);
    });
}

function awardPoints(betId) {
    const b = bets.find(x => x.id === betId);
    if (!b) return;

    const ptsStr = prompt(`Punti da assegnare a ${b.author}:`, b.pts);
    if (ptsStr !== null && !isNaN(parseInt(ptsStr))) {
        const pts = parseInt(ptsStr);
        
        db.ref('bets/' + betId).update({
            status: 'closed',
            awardedPts: pts
        });

        const u = users.find(x => x.name && x.name.toLowerCase() === b.author.toLowerCase());
        if (u) {
            const targetKey = u._dbKey || cleanKey(u.name);
            db.ref('users/' + targetKey).update({
                points: (u.points || 0) + pts
            });
        }
    }
}

function deleteBet(betId) {
    if (confirm("Vuoi eliminare questa scommessa?")) {
        db.ref('bets/' + betId).remove();
    }
}

function renderAdminUsers() {
    const container = document.getElementById('adminUsersList');
    container.innerHTML = '';

    if (users.length === 0) {
        container.innerHTML = '<p style="color:var(--text-secondary);">Nessun utente registrato.</p>';
        return;
    }

    users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'bet-card';
        const keyToUse = u._dbKey || cleanKey(u.name || '');
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:6px;">
                <span>${u.name || 'Senza Nome'}</span>
                <span style="color:var(--accent);">${u.points || 0} PT</span>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="btn-modern btn-secondary" style="flex:1; padding:4px 6px; font-size:11px;" onclick="editUserPoints('${keyToUse}')">Modifica PT</button>
                <button class="btn-modern btn-danger" style="padding:4px 6px; font-size:11px;" onclick="deleteUser('${keyToUse}', '${u.name || ''}')">Banna</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function editUserPoints(dbKey) {
    const u = users.find(x => x._dbKey === dbKey || cleanKey(x.name || '') === dbKey);
    if (!u) return alert("Utente non trovato!");
    const newPts = prompt(`Imposta punti per ${u.name}:`, u.points || 0);
    if (newPts !== null && !isNaN(parseInt(newPts))) {
        db.ref('users/' + dbKey).update({ points: parseInt(newPts) });
    }
}

function deleteUser(dbKey, username) {
    if (confirm(`Confermi il ban di ${username || 'questo utente'}?`)) {
        db.ref('users/' + dbKey).remove().then(() => {
            alert("Utente bannato ed eliminato con successo!");
            if (currentUser && (currentUser._dbKey === dbKey || (currentUser.name && currentUser.name.toLowerCase() === username.toLowerCase()))) {
                logout();
            }
        }).catch(err => {
            alert("Errore durante l'eliminazione: " + err.message);
        });
    }
}

function saveRules() {
    const newRules = document.getElementById('rulesTextarea').value;
    db.ref('rules').set(newRules);
    alert("Regolamento aggiornato!");
}

function loadCurrentUser() {
    const cu = localStorage.getItem('sb95_currentUser');
    if (cu) {
        const found = users.find(x => x.name && x.name.toLowerCase() === cu.toLowerCase());
        if (found) {
            currentUser = found;
            setStatus("Connesso come: " + currentUser.name);
        } else {
            logout();
        }
    }
}

window.onload = init;
</script>
</body>
